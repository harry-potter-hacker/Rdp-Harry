name: RDP
on:
  workflow_dispatch:
jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600
    steps:
      - name: Configure Core RDP and Fix Handshake Stalls
        run: |
          # 1. Enable RDP and drop Network Level Authentication
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" -Value 0 -Force

          # 2. Fix Handshake Stalls (Turn off server-side audio/drive redirection to stop hangs)
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "fDisableCam" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "fDisableCcm" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "fDisableLPT" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "fDisableClip" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "fDisableAudioCapture" -Value 1 -Force

          # 3. Optimize graphics pipeline for headless cloud runners
          New-Item -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT' -Name "Terminal Services" -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' `
            -Name "fWDDMGraphicsDriver" -Value 0 -Force

          # 4. Turn off Windows Firewall entirely
          netsh advfirewall set allprofiles state off
          
          # 5. Reload the configuration
          Restart-Service -Name TermService -Force

      - name: Set Main Admin Password and Grant Group Access
        run: |
          $mainAdminPassword = "YourMainAdminPassword123!" 
          net user runneradmin $mainAdminPassword
          net localgroup "Remote Desktop Users" runneradmin /add 2>$null
          net localgroup administrators runneradmin /add 2>$null
          echo "MAIN_ADMIN_PASS=$mainAdminPassword" >> $env:GITHUB_ENV

      - name: Tailscale Connection Setup
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          version: latest

      - name: Fetch and Verify Tailscale IP
        run: |
          $tsIP = tailscale ip -4
          if (-not $tsIP) {
            Write-Error "Tailscale IP could not be retrieved"
            exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Maintain Connection
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: runneradmin"
          Write-Host "Password: $env:MAIN_ADMIN_PASS"
          Write-Host "==================`n"
          
          while ($true) {
            Write-Host "[$(Get-Date)] RDP Active - Use Ctrl+C in workflow to terminate"
            Start-Sleep -Seconds 300
          }
          
