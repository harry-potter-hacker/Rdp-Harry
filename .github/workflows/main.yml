name: RDP
on:
  workflow_dispatch:
jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600
    steps:
      - name: Configure Core RDP, Optimize Audio Bandwidth, and Disable Firewall
        run: |
          # 1. Enable RDP and drop Network Level Authentication
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' `
            -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "SecurityLayer" -Value 0 -Force

          # 2. ENABLE AUDIO REDIRECTION & FORCE OPTIMIZED COMPRESSION
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "fDisableAudioCapture" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "fDisableAudio" -Value 0 -Force
          
          # Force Windows RDP to optimize sound delivery for dynamic bandwidth (Prevents drops)
          New-Item -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT' -Name "Terminal Services" -Force -ErrorAction SilentlyContinue
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' `
            -Name "AudioPlaybackMode" -Value 0 -Force

          # Keep other non-audio blocks optimized to prevent freezes
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "fDisableCam" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "fDisableCcm" -Value 1 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' `
            -Name "fDisableLPT" -Value 1 -Force

          # 3. FORCE-START THE WINDOWS AUDIO SERVICE
          Set-Service -Name Audiosrv -StartupType Automatic -ErrorAction SilentlyContinue
          Start-Service -Name Audiosrv -ErrorAction SilentlyContinue

          # 4. Optimize graphics pipeline to consume less network throughput
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Policies\Microsoft\Windows NT\Terminal Services' `
            -Name "fWDDMGraphicsDriver" -Value 0 -Force

          # 5. Turn off Windows Firewall entirely
          netsh advfirewall set allprofiles state off
          
          # 6. Reload RDP Configuration
          Restart-Service -Name TermService -Force

      - name: Set Main Admin Password and Grant Group Access
        run: |
          $mainAdminPassword = "YourMainAdminPassword123!" 
          net user runneradmin $mainAdminPassword
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "runneradmin" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "runneradmin" -ErrorAction SilentlyContinue
          echo "MAIN_ADMIN_PASS=$mainAdminPassword" >> $env:GITHUB_ENV
          $global:LASTEXITCODE = 0
          exit 0

      - name: Tailscale Connection Setup
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTH_KEY }}
          version: latest

      - name: Fetch and Verify Tailscale IP
        run: |
          $tsIP = tailscale ip -4
          if (-not $tsIP) {
            Write-Error "Tailscale IP could not be retrieved"
            exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
            Write-Error "TCP connection to RDP port 3389 failed"
            exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Maintain Connection
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address: $env:TAILSCALE_IP"
          Write-Host "Username: runneradmin"
          Write-Host "Password: $env:MAIN_ADMIN_PASS"
          Write-Host "==================`n"
          
          while ($true) {
            Write-Host "[$(Get-Date)] RDP Active - Use Ctrl+C in workflow to terminate"
            Start-Sleep -Seconds 300
          }
          
